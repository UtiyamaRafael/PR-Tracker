<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PR-Tracker · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="screen screen--app">

  <nav class="bottom-nav">
    <button class="nav-item is-active" data-target="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
        <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
        <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
        <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
      </svg>
      DASHBOARD
    </button>
    <button class="nav-item" data-target="exercicios.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 6.5 17.5 17.5"></path>
        <path d="M4 7l3-3 2 2-3 3z"></path>
        <path d="M17 20l3-3-2-2-3 3z"></path>
        <path d="M15 4l2 2M4 15l2 2"></path>
      </svg>
      EXERCÍCIO
    </button>
    <button class="nav-item" data-target="registro.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 8v8M8 12h8"></path>
      </svg>
      REGISTRO
    </button>
    <button class="nav-item" data-target="historico.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"></path>
        <path d="M3 4v5h5"></path>
        <path d="M12 7v5l3 3"></path>
      </svg>
      HISTÓRICO
    </button>
    <button class="nav-item" data-target="grafico.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20V10M12 20V4M20 20v-7"></path>
      </svg>
      GRÁFICO
    </button>
  </nav>

  <div class="app-main">

  <header class="app-header">
    <div class="brand brand--inline">
      <svg class="brand__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="2 12 7 12 9 18 15 6 17 12 22 12"></polyline>
      </svg>
      <div class="brand__name" style="font-size:18px;">PR<span>-</span>Tracker</div>
    </div>
  </header>

  <h1 class="page-title">Dashboard</h1>

  <div class="page-content">
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-card__label">PRs registrados</div>
        <div class="stat-card__value" id="statTotalPrs">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Exercícios cadastrados</div>
        <div class="stat-card__value" id="statExercicios">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Treinos no mês</div>
        <div class="stat-card__value" id="statTreinosMes">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Último treino</div>
        <div class="stat-card__value" id="statUltimoTreino">—</div>
      </div>
    </div>

    <div>
      <p class="section-title">Registros recentes</p>
      <div class="stack" id="recentesLista"></div>
    </div>
  </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
