<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PR Gym — Esqueci minha senha</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Esqueci minha senha</h1>

    <p>Informe seu e-mail. Se ele estiver cadastrado, você vai receber um link para criar uma nova senha.</p>

    <form id="forgot-form">
        <label for="email-input">E-mail</label>
        <input type="email" id="email-input" required autocomplete="email">

        <button type="submit">Enviar link</button>
    </form>

    <p id="feedback"></p>

    <p><a href="login.html">Voltar para o login</a></p>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email-input').value;
            const feedback = document.getElementById('feedback');
            const button = e.target.querySelector('button');

            button.disabled = true;

            const response = await fetch(`${API_BASE}/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            feedback.textContent = await response.text();
            feedback.className = response.ok ? 'ok' : 'erro';
            button.disabled = false;
        });
    </script>
</body>
</html>
