<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PR-Tracker · Recuperar senha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="screen screen--auth">

  <div class="hero-pane">
    <svg class="hero-pane__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="2 12 7 12 9 18 15 6 17 12 22 12"></polyline>
    </svg>
    <h2>Esqueceu sua senha?<br>A gente te ajuda.</h2>
    <p>Informe seu usuário e enviaremos um link para você criar uma nova senha.</p>
  </div>

  <div class="content-pane">
  <div class="brand">
    <svg class="brand__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="2 12 7 12 9 18 15 6 17 12 22 12"></polyline>
    </svg>
    <div class="brand__name">PR<span>-</span>Tracker</div>
  </div>

  <div class="auth-wrap">
    <form class="auth-card" id="esqueciSenhaForm" novalidate>
      <h1 class="auth-card__title">RECUPERAR SENHA</h1>

      <div class="field">
        <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <input type="email" name="email" placeholder="E-mail" autocomplete="username" required />
      </div>

      <button type="submit" class="btn-primary">ENVIAR LINK</button>

      <p class="form-hint" id="esqueciFeedback" style="display:none; text-align:center; margin-top:16px;"></p>

      <div class="auth-links">
        <div><a href="login.html">Voltar para o login</a></div>
      </div>
    </form>
  </div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
