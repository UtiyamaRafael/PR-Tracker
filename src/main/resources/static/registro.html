<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Gym - Novo Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">

    <nav class="tabs">
        <a href="index.html">Dashboard</a>
        <a href="registro.html" class="active">Registro</a>
        <a href="exercicios.html">Exercícios</a>
        <a href="historico.html">Histórico</a>
        <a href="grafico.html">Gráfico</a>
    </nav>

    <h1>Novo Registro</h1>

    <form id="record-form">
        <label for="exercise-select">Exercício</label>
        <select id="exercise-select" required></select>

        <label for="weight-input">Peso (kg) — deixe vazio se for peso corporal</label>
        <input type="number" id="weight-input" step="0.5" placeholder="Ex: 80">

        <label for="reps-input">Repetições</label>
        <input type="number" id="reps-input" required placeholder="Ex: 8">

        <button type="submit">Salvar</button>
    </form>

    <div id="feedback"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
